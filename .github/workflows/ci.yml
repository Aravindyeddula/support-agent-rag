name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m app.evaluate --output reports/ci-retrieval.json
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-report
          path: reports/ci-retrieval.json
